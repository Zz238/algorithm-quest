name: Check Windows admin startup

on:
  push:
    branches: [main]
    paths:
      - 'start-admin-windows.bat'
      - 'admin/**'
      - 'src/config/cloud.js'
      - 'package.json'
      - '.gitattributes'
      - 'scripts/check-admin-windows.ps1'
      - '.github/workflows/check-admin-windows.yml'
  pull_request:
    paths:
      - 'start-admin-windows.bat'
      - 'admin/**'
      - 'src/config/cloud.js'
      - 'package.json'
      - '.gitattributes'
      - 'scripts/check-admin-windows.ps1'
      - '.github/workflows/check-admin-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Verify CMD startup and error windows
        shell: pwsh
        run: ./scripts/check-admin-windows.ps1
